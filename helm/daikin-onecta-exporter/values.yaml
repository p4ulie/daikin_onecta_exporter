image:
  repository: 10.34.1.1:30095/daikin-onecta-exporter
  tag: ""  # empty means the chart's appVersion

onecta:
  secretName: ""  # required, an existing Secret with keys client-id, client-secret, token-json; the chart never creates one
  interval: 600  # seconds between cloud polls; Daikin allows about 200 calls a day

persistence:
  size: 1Gi  # holds the rotated refresh token
  storageClass: ""  # empty means the cluster default

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi

# The chart installs no CRDs; these need prometheus-operator and the Grafana sidecar in the cluster.
serviceMonitor:
  enabled: false
  interval: 60s

prometheusRule:
  enabled: false

alerts:
  tankMin: 40  # degrees C, hot water tank

dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Home
